<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="400" fill="#fbfbf9"/>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="50" y="130" width="220" height="120" rx="12" fill="#182420"/><text x="160" y="170" fill="#fff" font-weight="700">a Claude Code plugin</text><text x="160" y="196" fill="#cfd8d3" font-size="12">commands · skills</text><text x="160" y="216" fill="#cfd8d3" font-size="12">MCP servers · hooks</text>
    <path d="M272 190 h56" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="300" y="178" font-size="11.5" fill="#7f8a84">port</text>
  </g>
  <text x="560" y="54" text-anchor="middle" font-size="13" letter-spacing="2" fill="#0e7a4d" font-weight="600">CAME ACROSS WITH RENAMES</text>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="340" y="76" width="440" height="270" rx="12" fill="#e3f2ea" stroke="#0e7a4d"/>
    <rect x="364" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="459" y="124" font-weight="700">14 skills</text><text x="459" y="142" fill="#44524c" font-size="12">read as written</text>
    <rect x="566" y="100" width="190" height="52" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="661" y="124" font-weight="700">4 MCP servers</text><text x="661" y="142" fill="#44524c" font-size="12">OAuth worked</text>
    <rect x="364" y="166" width="190" height="52" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="459" y="190" font-weight="600">plugin-relative paths</text><text x="459" y="208" fill="#44524c" font-size="12">resolved at runtime</text>
    <rect x="566" y="166" width="190" height="52" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="661" y="190" font-weight="600">"ask the user" tool</text><text x="661" y="208" fill="#44524c" font-size="12">mapped 1 : 1</text>
    <rect x="364" y="232" width="392" height="52" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="560" y="256" font-weight="600">hooks fire</text><text x="560" y="274" fill="#44524c" font-size="12">same events, similar format</text>
    <text x="560" y="322" fill="#0e7a4d" font-size="12.5" font-weight="600">end-to-end run: about an hour</text>
  </g>
  <text x="980" y="54" text-anchor="middle" font-size="13" letter-spacing="2" fill="#a13333" font-weight="600">THREE SURPRISES</text>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="820" y="76" width="320" height="76" rx="10" fill="#faf0da" stroke="#a06b12"/><text x="980" y="102" font-weight="700">names from file name only</text><text x="980" y="122" fill="#44524c" font-size="12">qa/plan.md and plan.md → both /plan</text><text x="980" y="140" fill="#a06b12" font-size="12" font-weight="600">loud · you notice at once</text>
    <rect x="820" y="172" width="320" height="76" rx="10" fill="#faf0da" stroke="#a06b12"/><text x="980" y="198" font-weight="700">arguments dropped</text><text x="980" y="218" fill="#44524c" font-size="12">command ran without the ticket ID</text><text x="980" y="236" fill="#a06b12" font-size="12" font-weight="600">loud · wrong output</text>
    <rect x="820" y="268" width="320" height="78" rx="10" fill="#f8e6e6" stroke="#a13333" stroke-width="2"/><text x="980" y="294" font-weight="700" fill="#a13333">safety hook guessed</text><text x="980" y="314" fill="#44524c" font-size="12">harmless write blocked, turn ended</text><text x="980" y="332" fill="#a13333" font-size="12" font-weight="600">silent · nobody knew why</text>
  </g>
  <text x="600" y="382" text-anchor="middle" font-size="12.5" fill="#7f8a84">two of the three told you something was wrong · the third just stopped</text>
</svg>
