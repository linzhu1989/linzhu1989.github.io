<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="PingFang SC, Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a13333"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7a4d"/></marker></defs>
  <rect width="1200" height="430" fill="#fbfbf9"/>
  <text x="300" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#a13333" font-weight="600">之前 · 解析失败就去猜</text>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="160" y="66" width="280" height="54" rx="10" fill="#182420"/><text x="300" y="89" fill="#fff" font-weight="600">shell 命令</text><text x="300" y="108" fill="#cfd8d3" font-size="12">heredoc · 带撇号 · 提到 merge</text>
    <rect x="160" y="146" width="280" height="54" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="300" y="169" font-weight="600">用 shell 分词器解析</text><text x="300" y="188" fill="#44524c" font-size="12">看程序和参数</text>
    <path d="M300 122 v22" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="50" y="236" width="220" height="54" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="160" y="259" font-weight="600">解析成功</text><text x="160" y="278" fill="#44524c" font-size="12">push/merge 就问人，否则放行</text>
    <rect x="330" y="236" width="220" height="54" rx="10" fill="#faf0da" stroke="#a06b12"/><text x="440" y="259" font-weight="600">解析失败</text><text x="440" y="278" fill="#44524c" font-size="12">在原始文本里搜关键词</text>
    <path d="M250 202 L190 234" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M350 202 L410 234" stroke="#a13333" stroke-width="1.6" marker-end="url(#r)"/>
    <rect x="330" y="316" width="220" height="54" rx="10" fill="#f8e6e6" stroke="#a13333" stroke-width="2"/><text x="440" y="339" fill="#a13333" font-weight="700">搜到 "merge" · 拦截</text><text x="440" y="358" fill="#a13333" font-size="12">不说原因 · 这一轮直接结束</text>
    <path d="M440 292 v22" stroke="#a13333" stroke-width="1.6" marker-end="url(#r)"/>
  </g>
  <text x="300" y="404" text-anchor="middle" font-size="12.5" fill="#7f8a84">无害的写操作被拦，没人知道为什么</text>
  <line x1="600" y1="40" x2="600" y2="400" stroke="#e4e8e4"/>
  <text x="900" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#0e7a4d" font-weight="600">之后 · 解析失败就明说</text>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="760" y="66" width="280" height="54" rx="10" fill="#182420"/><text x="900" y="89" fill="#fff" font-weight="600">shell 命令</text><text x="900" y="108" fill="#cfd8d3" font-size="12">同样的 heredoc，同样的撇号</text>
    <rect x="760" y="146" width="280" height="54" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="900" y="169" font-weight="600">用 shell 分词器解析</text><text x="900" y="188" fill="#44524c" font-size="12">看程序和参数</text>
    <path d="M900 122 v22" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="650" y="236" width="220" height="54" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="760" y="259" font-weight="600">解析成功</text><text x="760" y="278" fill="#44524c" font-size="12">push/merge 就问人，否则放行</text>
    <rect x="930" y="236" width="220" height="54" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="1040" y="259" font-weight="700" fill="#0e7a4d">解析失败 · 拒绝</text><text x="1040" y="278" fill="#44524c" font-size="12">原因：「读不懂这条命令」</text>
    <path d="M850 202 L790 234" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M950 202 L1010 234" stroke="#0e7a4d" stroke-width="1.6" marker-end="url(#g)"/>
    <rect x="930" y="316" width="220" height="54" rx="10" fill="#ffffff" stroke="#0e7a4d"/><text x="1040" y="339" font-weight="600">Agent 转告给人</text><text x="1040" y="358" fill="#44524c" font-size="12">看一眼，接着跑</text>
    <path d="M1040 292 v22" stroke="#0e7a4d" stroke-width="1.6" marker-end="url(#g)"/>
  </g>
  <text x="900" y="404" text-anchor="middle" font-size="12.5" fill="#7f8a84">还是默认拦截，但现在有人知道</text>
</svg>
