    <path d="M950 202 L1010 234" stroke="#0e7a4d" stroke-width="1.6" marker-end="url(#g)"/>
    <rect x="930" y="316" width="220" height="54" rx="10" fill="#ffffff" stroke="#0e7a4d"/><text x="1040" y="339" font-weight="600">agent tells the human</text><text x="1040" y="358" fill="#44524c" font-size="12">one look · run continues</text>
    <path d="M1040 292 v22" stroke="#0e7a4d" stroke-width="1.6" marker-end="url(#g)"/>
  </g>
  <text x="900" y="404" text-anchor="middle" font-size="12.5" fill="#7f8a84">still fails closed · now a person finds out</text>
