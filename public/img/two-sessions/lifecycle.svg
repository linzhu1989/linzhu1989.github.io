<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="420" fill="#fbfbf9"/>
  <g font-size="13" letter-spacing="2" font-weight="600" text-anchor="middle">
    <text x="210" y="44" fill="#0e7a4d">START</text>
    <text x="600" y="44" fill="#182420">DURING</text>
    <text x="990" y="44" fill="#0e7a4d">END</text>
  </g>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="70" y="66" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="210" y="90" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">pull --rebase --autostash</text><text x="210" y="109" fill="#44524c" font-size="12">get what other sessions pushed</text>
    <rect x="70" y="140" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="210" y="164" font-weight="600">read INDEX.md</text><text x="210" y="183" fill="#44524c" font-size="12">claimed under 24h ago? someone owns it · stop</text>
    <rect x="70" y="214" width="280" height="66" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="210" y="240" font-weight="700" fill="#0e7a4d">claim the topic, push at once</text><text x="210" y="260" fill="#44524c" font-size="12">one line: "in progress (what, when)"</text>
    <rect x="70" y="298" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="210" y="322" font-weight="600">read the topic's notes.md</text><text x="210" y="341" fill="#44524c" font-size="12">start from "pick up here"</text>
    <path d="M210 124 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M210 198 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M210 282 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="460" y="66" width="280" height="56" rx="10" fill="#182420"/><text x="600" y="90" font-weight="600" fill="#ffffff">only your folder, your INDEX row</text><text x="600" y="109" fill="#cfd8d3" font-size="12">shared files: your section, own commit</text>
    <rect x="460" y="140" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="600" y="164" font-weight="600">commit small, at checkpoints</text><text x="600" y="183" fill="#44524c" font-size="12">not one big commit at the end</text>
    <rect x="460" y="214" width="280" height="66" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="600" y="240" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">git add topics/&lt;slug&gt;/ INDEX.md</text><text x="600" y="260" fill="#a13333" font-size="12" font-weight="600">never git add -A</text>
    <rect x="460" y="298" width="280" height="56" rx="10" fill="#faf0da" stroke="#a06b12"/><text x="600" y="322" font-weight="600">a change you didn't make?</text><text x="600" y="341" fill="#44524c" font-size="12">leave it, tell the human</text>

    <rect x="850" y="66" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="990" y="90" font-weight="600">write "next session, pick up here"</text><text x="990" y="109" fill="#44524c" font-size="12">in the topic's notes.md</text>
    <rect x="850" y="140" width="280" height="56" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="990" y="164" font-weight="700" fill="#0e7a4d">release the claim</text><text x="990" y="183" fill="#44524c" font-size="12">claim → a real status, bump the date</text>
    <rect x="850" y="214" width="280" height="66" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="990" y="240" font-weight="600">commit, pull, push</text><text x="990" y="260" fill="#44524c" font-size="12">git status -sb: nothing ahead</text>
    <rect x="850" y="298" width="280" height="56" rx="10" fill="#f8e6e6" stroke="#a13333"/><text x="990" y="322" font-weight="700" fill="#a13333">never force-push</text><text x="990" y="341" fill="#44524c" font-size="12">a rebase conflict in a stranger's file → ask</text>
    <path d="M990 124 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M990 198 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M352 247 h104" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M742 247 h104" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
  </g>
  <text x="600" y="392" text-anchor="middle" font-size="12.5" fill="#7f8a84">every step leaves a trace in git that the next session reads when it starts</text>
</svg>
