<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="PingFang SC, Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="420" fill="#fbfbf9"/>
  <g font-size="13" letter-spacing="2" font-weight="600" text-anchor="middle">
    <text x="210" y="44" fill="#0e7a4d">开始</text>
    <text x="600" y="44" fill="#182420">进行中</text>
    <text x="990" y="44" fill="#0e7a4d">结束</text>
  </g>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="70" y="66" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="210" y="90" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">pull --rebase --autostash</text><text x="210" y="109" fill="#44524c" font-size="12">先拿到别的会话 push 的内容</text>
    <rect x="70" y="140" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="210" y="164" font-weight="600">读 INDEX.md</text><text x="210" y="183" fill="#44524c" font-size="12">24 小时内有人认领？停下，问人</text>
    <rect x="70" y="214" width="280" height="66" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="210" y="240" font-weight="700" fill="#0e7a4d">认领主题，马上 push</text><text x="210" y="260" fill="#44524c" font-size="12">只改一行：「进行中（做什么，几点）」</text>
    <rect x="70" y="298" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="210" y="322" font-weight="600">读这个主题的 notes.md</text><text x="210" y="341" fill="#44524c" font-size="12">从「下次从这里继续」开始</text>
    <path d="M210 124 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M210 198 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M210 282 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="460" y="66" width="280" height="56" rx="10" fill="#182420"/><text x="600" y="90" font-weight="600" fill="#ffffff">只改自己的文件夹和 INDEX 那一行</text><text x="600" y="109" fill="#cfd8d3" font-size="12">共享文件：只改自己那段，单独提交</text>
    <rect x="460" y="140" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="600" y="164" font-weight="600">到节点就提交，小步走</text><text x="600" y="183" fill="#44524c" font-size="12">不攒到最后一起交</text>
    <rect x="460" y="214" width="280" height="66" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="600" y="240" font-weight="600" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">git add topics/&lt;slug&gt;/ INDEX.md</text><text x="600" y="260" fill="#a13333" font-size="12" font-weight="600">永远不用 git add -A</text>
    <rect x="460" y="298" width="280" height="56" rx="10" fill="#faf0da" stroke="#a06b12"/><text x="600" y="322" font-weight="600">看到不是自己改的？</text><text x="600" y="341" fill="#44524c" font-size="12">不碰，告诉人</text>

    <rect x="850" y="66" width="280" height="56" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="990" y="90" font-weight="600">写「下次从这里继续」</text><text x="990" y="109" fill="#44524c" font-size="12">写在主题的 notes.md 里</text>
    <rect x="850" y="140" width="280" height="56" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="990" y="164" font-weight="700" fill="#0e7a4d">释放认领</text><text x="990" y="183" fill="#44524c" font-size="12">换成真实状态，更新日期</text>
    <rect x="850" y="214" width="280" height="66" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="990" y="240" font-weight="600">提交、拉取、push</text><text x="990" y="260" fill="#44524c" font-size="12">git status -sb：没有未推送</text>
    <rect x="850" y="298" width="280" height="56" rx="10" fill="#f8e6e6" stroke="#a13333"/><text x="990" y="322" font-weight="700" fill="#a13333">永远不 force-push</text><text x="990" y="341" fill="#44524c" font-size="12">别人的文件 rebase 冲突 → 问人</text>
    <path d="M990 124 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M990 198 v14" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M352 247 h104" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M742 247 h104" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
  </g>
  <text x="600" y="392" text-anchor="middle" font-size="12.5" fill="#7f8a84">每一步都在 git 里留下痕迹，下一个会话启动时就能读到</text>
</svg>
