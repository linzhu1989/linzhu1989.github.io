<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="PingFang SC, Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="460" fill="#fbfbf9"/>
  <text x="600" y="40" text-anchor="middle" font-size="13" letter-spacing="2" fill="#182420" font-weight="600">接口 × 状态码 × 请求 → 结果</text>
  <g font-size="13" fill="#182420">
    <text x="70" y="88" font-size="12" fill="#7f8a84" font-weight="600" letter-spacing="1">接口</text>
    <text x="330" y="88" font-size="12" fill="#7f8a84" font-weight="600" letter-spacing="1">返回了什么</text>
    <text x="640" y="88" font-size="12" fill="#7f8a84" font-weight="600" letter-spacing="1">结果</text>
    <text x="860" y="88" font-size="12" fill="#7f8a84" font-weight="600" letter-spacing="1">服务怎么做</text>
    <line x1="60" y1="100" x2="1140" y2="100" stroke="#c9d0cb"/>

    <text x="70" y="136" font-weight="600">查航班</text>
    <text x="330" y="136" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">200，空列表</text>
    <rect x="630" y="116" width="150" height="30" rx="15" fill="#e3f2ea" stroke="#0e7a4d"/><text x="705" y="136" text-anchor="middle" fill="#0e7a4d" font-weight="700">正常</text>
    <text x="860" y="136" fill="#44524c">这天没航班：试下一天</text>
    <line x1="60" y1="160" x2="1140" y2="160" stroke="#e4e8e4"/>

    <text x="70" y="196" font-weight="600">选座</text>
    <text x="330" y="196" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">404「未初始化」</text>
    <rect x="630" y="176" width="150" height="30" rx="15" fill="#faf0da" stroke="#a06b12"/><text x="705" y="196" text-anchor="middle" fill="#a06b12" font-weight="700">跳过这一项</text>
    <text x="860" y="196" fill="#44524c">这个航班用不了：跳过，记一次数</text>
    <line x1="60" y1="220" x2="1140" y2="220" stroke="#e4e8e4"/>

    <text x="70" y="256" font-weight="600">每一项都一样失败</text>
    <text x="330" y="256" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">每一项都被跳过</text>
    <rect x="630" y="236" width="150" height="30" rx="15" fill="#f8e6e6" stroke="#a13333"/><text x="705" y="256" text-anchor="middle" fill="#a13333" font-weight="700">停止</text>
    <text x="860" y="256" fill="#44524c">已经不是运气问题：停下，说清楚</text>
    <line x1="60" y1="280" x2="1140" y2="280" stroke="#e4e8e4"/>

    <text x="70" y="316" font-weight="600">预订路由</text>
    <text x="330" y="316" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">5xx · 断连 · 超时</text>
    <rect x="630" y="296" width="150" height="30" rx="15" fill="#f8e6e6" stroke="#a13333"/><text x="705" y="316" text-anchor="middle" fill="#a13333" font-weight="700">停止</text>
    <text x="860" y="316" fill="#44524c">说明哪个服务、哪个接口、找谁</text>
    <line x1="60" y1="340" x2="1140" y2="340" stroke="#e4e8e4"/>

    <text x="70" y="376" font-weight="600">其他情况</text>
    <text x="330" y="376" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">没见过的格式</text>
    <rect x="630" y="356" width="150" height="30" rx="15" fill="#f8e6e6" stroke="#a13333"/><text x="705" y="376" text-anchor="middle" fill="#a13333" font-weight="700">停止</text>
    <text x="860" y="376" fill="#44524c">原样报告，不猜原因</text>
  </g>
  <text x="600" y="430" text-anchor="middle" font-size="12.5" fill="#7f8a84">同样是 404，在一个接口上是正常结果，在另一个接口上就该停下</text>
</svg>
