<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="460" fill="#fbfbf9"/>
  <text x="600" y="40" text-anchor="middle" font-size="13" letter-spacing="2" fill="#182420" font-weight="600">ENDPOINT × STATUS × REQUEST → OUTCOME</text>
  <g font-size="13" fill="#182420">
    <text x="70" y="88" font-size="12" fill="#7f8a84" font-weight="600" letter-spacing="1">ENDPOINT</text>
    <text x="330" y="88" font-size="12" fill="#7f8a84" font-weight="600" letter-spacing="1">WHAT CAME BACK</text>
    <text x="640" y="88" font-size="12" fill="#7f8a84" font-weight="600" letter-spacing="1">OUTCOME</text>
    <text x="860" y="88" font-size="12" fill="#7f8a84" font-weight="600" letter-spacing="1">WHAT THE SERVICE DOES</text>
    <line x1="60" y1="100" x2="1140" y2="100" stroke="#c9d0cb"/>

    <text x="70" y="136" font-weight="600">flight search</text>
    <text x="330" y="136" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">200, empty list</text>
    <rect x="630" y="116" width="150" height="30" rx="15" fill="#e3f2ea" stroke="#0e7a4d"/><text x="705" y="136" text-anchor="middle" fill="#0e7a4d" font-weight="700">normal</text>
    <text x="860" y="136" fill="#44524c">no flights that day: try the next date</text>
    <line x1="60" y1="160" x2="1140" y2="160" stroke="#e4e8e4"/>

    <text x="70" y="196" font-weight="600">seat map</text>
    <text x="330" y="196" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">404 "not initialised"</text>
    <rect x="630" y="176" width="150" height="30" rx="15" fill="#faf0da" stroke="#a06b12"/><text x="705" y="196" text-anchor="middle" fill="#a06b12" font-weight="700">skip item</text>
    <text x="860" y="196" fill="#44524c">this flight can't be used: skip, count it</text>
    <line x1="60" y1="220" x2="1140" y2="220" stroke="#e4e8e4"/>

    <text x="70" y="256" font-weight="600">any item, again and again</text>
    <text x="330" y="256" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">same skip, every item</text>
    <rect x="630" y="236" width="150" height="30" rx="15" fill="#f8e6e6" stroke="#a13333"/><text x="705" y="256" text-anchor="middle" fill="#a13333" font-weight="700">stop</text>
    <text x="860" y="256" fill="#44524c">not bad luck any more: stop and say so</text>
    <line x1="60" y1="280" x2="1140" y2="280" stroke="#e4e8e4"/>

    <text x="70" y="316" font-weight="600">booking router</text>
    <text x="330" y="316" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">5xx · reset · timeout</text>
    <rect x="630" y="296" width="150" height="30" rx="15" fill="#f8e6e6" stroke="#a13333"/><text x="705" y="316" text-anchor="middle" fill="#a13333" font-weight="700">stop</text>
    <text x="860" y="316" fill="#44524c">name the service, the endpoint, who helps</text>
    <line x1="60" y1="340" x2="1140" y2="340" stroke="#e4e8e4"/>

    <text x="70" y="376" font-weight="600">anything else</text>
    <text x="330" y="376" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5">a shape never seen</text>
    <rect x="630" y="356" width="150" height="30" rx="15" fill="#f8e6e6" stroke="#a13333"/><text x="705" y="376" text-anchor="middle" fill="#a13333" font-weight="700">stop</text>
    <text x="860" y="376" fill="#44524c">report what came back, don't guess a reason</text>
  </g>
  <text x="600" y="430" text-anchor="middle" font-size="12.5" fill="#7f8a84">the same 404 can be normal on one endpoint and a reason to stop on another</text>
</svg>
