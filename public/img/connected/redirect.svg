<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#0e7a4d"/></marker>
  <marker id="r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a13333"/></marker></defs>
  <rect width="1200" height="360" fill="#fbfbf9"/>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <text x="190" y="44" font-size="13" letter-spacing="2" font-weight="600">THE SERVICE</text>
    <text x="600" y="44" font-size="13" letter-spacing="2" font-weight="600">OLD DOMAIN</text>
    <text x="1010" y="44" font-size="13" letter-spacing="2" font-weight="600">NEW DOMAIN</text>
    <rect x="80" y="66" width="220" height="250" rx="12" fill="#182420"/><text x="190" y="190" fill="#fff" font-weight="600">Jira client</text><text x="190" y="210" fill="#cfd8d3" font-size="12">base URL still old</text>
    <rect x="490" y="66" width="220" height="250" rx="12" fill="#ffffff" stroke="#c9d0cb"/><text x="600" y="190" font-weight="600">answers every path</text><text x="600" y="210" fill="#44524c" font-size="12">302 → new domain</text>
    <rect x="900" y="66" width="220" height="250" rx="12" fill="#e3f2ea" stroke="#0e7a4d"/><text x="1010" y="190" font-weight="600" fill="#0e7a4d">the real Jira</text>
    <text x="395" y="96" font-size="12" font-weight="700" fill="#0e7a4d">GET</text>
    <path d="M302 106 h184" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="805" y="96" font-size="12" fill="#0e7a4d">client follows the 302</text>
    <path d="M712 106 h184" stroke="#0e7a4d" stroke-width="1.6" marker-end="url(#g)"/>
    <text x="805" y="132" font-size="12" fill="#0e7a4d" font-weight="600">followed by default</text>
    <text x="395" y="250" font-size="12" font-weight="700" fill="#a13333">POST / PUT</text>
    <path d="M302 260 h184" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M488 286 h-184" stroke="#a13333" stroke-width="1.6" marker-end="url(#r)"/>
    <text x="395" y="304" font-size="12" fill="#a13333">302 back, not followed</text>
    <rect x="740" y="242" width="140" height="40" rx="8" fill="#f8e6e6" stroke="#a13333"/><text x="810" y="267" font-size="12" font-weight="700" fill="#a13333">never arrives</text>
  </g>
  <text x="600" y="346" text-anchor="middle" font-size="12.5" fill="#7f8a84">clients don't re-send a write to a new address on their own · searches, updates and links failed quietly</text>
</svg>
