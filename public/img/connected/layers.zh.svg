<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="PingFang SC, Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="400" fill="#fbfbf9"/>
  <text x="600" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#182420" font-weight="600">一次新建请求 · 每一层报的是什么</text>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="50" y="80" width="230" height="64" rx="10" fill="#182420"/><text x="165" y="107" fill="#fff" font-weight="600">机器人</text><text x="165" y="127" fill="#cfd8d3" font-size="12">「建一张工单」</text>
    <rect x="340" y="80" width="230" height="64" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="455" y="107" fill="#0e7a4d" font-weight="700">连接：已连接</text><text x="455" y="127" fill="#44524c" font-size="12">凭证存着</text>
    <rect x="630" y="80" width="230" height="64" rx="10" fill="#faf0da" stroke="#a06b12"/><text x="745" y="107" font-weight="700" fill="#a06b12">Jira: 400 / 404</text><text x="745" y="127" fill="#44524c" font-size="12">「找不到」「请求错误」</text>
    <rect x="920" y="80" width="230" height="64" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="1035" y="107" fill="#0e7a4d" font-weight="700">任务：成功</text><text x="1035" y="127" fill="#44524c" font-size="12">忽略了 HTTP 错误</text>
    <path d="M282 112 h54" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M572 112 h54" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M862 112 h54" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="455" y="180" fill="#44524c" font-size="12">只检查凭证有没有存，</text><text x="455" y="198" fill="#44524c" font-size="12">不检查 Jira 认不认</text>
    <text x="745" y="180" fill="#44524c" font-size="12">Basic auth 不对 = 匿名用户；</text><text x="745" y="198" fill="#44524c" font-size="12">匿名用户看不到这个项目</text>
    <text x="1035" y="180" fill="#44524c" font-size="12">不管返回什么，</text><text x="1035" y="198" fill="#44524c" font-size="12">任务都按成功结束，400 也算</text>
    <rect x="630" y="236" width="230" height="46" rx="8" fill="#ffffff" stroke="#c9d0cb"/><text x="745" y="257" font-size="11.5" fill="#44524c">唯一的线索在响应头里：</text><text x="745" y="274" font-size="11.5" font-family="ui-monospace, SF Mono, Menlo, monospace">AUTHENTICATED_FAILED</text>
    <path d="M745 210 v22" stroke="#c9d0cb" stroke-width="1.4"/>
    <rect x="340" y="312" width="520" height="54" rx="10" fill="#f8e6e6" stroke="#a13333" stroke-width="2"/><text x="600" y="335" fill="#a13333" font-weight="700">真实情况：工单一张也没建出来</text><text x="600" y="354" fill="#a13333" font-size="12">上面每一层都显示正常，这种情况持续了大半天</text>
  </g>
</svg>
