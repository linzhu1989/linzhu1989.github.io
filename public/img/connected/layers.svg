<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="400" fill="#fbfbf9"/>
  <text x="600" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#182420" font-weight="600">ONE CREATE REQUEST · WHAT EACH LAYER SAID</text>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="50" y="80" width="230" height="64" rx="10" fill="#182420"/><text x="165" y="107" fill="#fff" font-weight="600">the bot</text><text x="165" y="127" fill="#cfd8d3" font-size="12">"create a ticket"</text>
    <rect x="340" y="80" width="230" height="64" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="455" y="107" fill="#0e7a4d" font-weight="700">connection: Connected</text><text x="455" y="127" fill="#44524c" font-size="12">credential stored</text>
    <rect x="630" y="80" width="230" height="64" rx="10" fill="#faf0da" stroke="#a06b12"/><text x="745" y="107" font-weight="700" fill="#a06b12">Jira: 400 / 404</text><text x="745" y="127" fill="#44524c" font-size="12">"not found", "bad request"</text>
    <rect x="920" y="80" width="230" height="64" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="1035" y="107" fill="#0e7a4d" font-weight="700">job: success</text><text x="1035" y="127" fill="#44524c" font-size="12">HTTP errors ignored</text>
    <path d="M282 112 h54" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M572 112 h54" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M862 112 h54" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <text x="455" y="180" fill="#44524c" font-size="12">checks that a secret is saved,</text><text x="455" y="198" fill="#44524c" font-size="12">not that Jira accepts it</text>
    <text x="745" y="180" fill="#44524c" font-size="12">bad Basic auth = anonymous user;</text><text x="745" y="198" fill="#44524c" font-size="12">anonymous can't see the project</text>
    <text x="1035" y="180" fill="#44524c" font-size="12">any response ends the job</text><text x="1035" y="198" fill="#44524c" font-size="12">as a success, 400 included</text>
    <rect x="630" y="236" width="230" height="46" rx="8" fill="#ffffff" stroke="#c9d0cb"/><text x="745" y="257" font-size="11.5" fill="#44524c">the only clue, a header:</text><text x="745" y="274" font-size="11.5" font-family="ui-monospace, SF Mono, Menlo, monospace">AUTHENTICATED_FAILED</text>
    <path d="M745 210 v22" stroke="#c9d0cb" stroke-width="1.4"/>
    <rect x="340" y="312" width="520" height="54" rx="10" fill="#f8e6e6" stroke="#a13333" stroke-width="2"/><text x="600" y="335" fill="#a13333" font-weight="700">the truth: no ticket was created</text><text x="600" y="354" fill="#a13333" font-size="12">for most of a day, while everything above looked fine</text>
  </g>
</svg>
