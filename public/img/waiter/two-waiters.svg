<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="430" fill="#fbfbf9"/>
  <text x="60" y="44" font-size="13" letter-spacing="2" fill="#a13333" font-weight="600">BEFORE · WAITER CHECKS ONE THING</text>
  <g font-size="13" fill="#182420">
    <text x="60" y="94" font-weight="600">producer</text><text x="60" y="112" fill="#44524c" font-size="12">nohup run.sh</text>
    <line x1="280" y1="100" x2="1120" y2="100" stroke="#e4e8e4" stroke-width="2"/>
    <rect x="280" y="90" width="14" height="20" rx="3" fill="#a13333"/>
    <text x="304" y="105" fill="#a13333" font-size="12" font-weight="600">"No such file or directory" · exit in 1 s</text>
    <text x="60" y="146" font-weight="600">waiter</text><text x="60" y="164" fill="#44524c" font-size="12">grep ALL_DONE, sleep</text>
    <line x1="280" y1="150" x2="1120" y2="150" stroke="#e4e8e4" stroke-width="2"/>
    <circle cx="330" cy="150" r="5" fill="#a06b12"/><circle cx="370" cy="150" r="5" fill="#a06b12"/><circle cx="410" cy="150" r="5" fill="#a06b12"/><circle cx="450" cy="150" r="5" fill="#a06b12"/><circle cx="490" cy="150" r="5" fill="#a06b12"/><circle cx="530" cy="150" r="5" fill="#a06b12"/><circle cx="570" cy="150" r="5" fill="#a06b12"/><circle cx="610" cy="150" r="5" fill="#a06b12"/><circle cx="650" cy="150" r="5" fill="#a06b12"/><circle cx="690" cy="150" r="5" fill="#a06b12"/><circle cx="730" cy="150" r="5" fill="#a06b12"/><circle cx="770" cy="150" r="5" fill="#a06b12"/><circle cx="810" cy="150" r="5" fill="#a06b12"/><circle cx="850" cy="150" r="5" fill="#a06b12"/><circle cx="890" cy="150" r="5" fill="#a06b12"/><circle cx="930" cy="150" r="5" fill="#a06b12"/><circle cx="970" cy="150" r="5" fill="#a06b12"/><circle cx="1010" cy="150" r="5" fill="#a06b12"/><circle cx="1050" cy="150" r="5" fill="#a06b12"/><circle cx="1090" cy="150" r="5" fill="#a06b12"/>
    <text x="290" y="186" fill="#44524c" font-size="12">12:47</text>
    <text x="1120" y="186" text-anchor="end" fill="#44524c" font-size="12">14:41 · a person asks "is it still running?"</text>
    <text x="700" y="186" text-anchor="middle" fill="#a06b12" font-size="12" font-weight="600">not yet · not yet · not yet …</text>
  </g>
  <line x1="60" y1="222" x2="1140" y2="222" stroke="#e4e8e4"/>
  <text x="60" y="262" font-size="13" letter-spacing="2" fill="#0e7a4d" font-weight="600">AFTER · WAITER CHECKS THREE THINGS</text>
  <g font-size="13" fill="#182420">
    <text x="60" y="312" font-weight="600">producer</text><text x="60" y="330" fill="#44524c" font-size="12">pid saved at launch</text>
    <line x1="280" y1="318" x2="1120" y2="318" stroke="#e4e8e4" stroke-width="2"/>
    <rect x="280" y="308" width="14" height="20" rx="3" fill="#a13333"/>
    <text x="60" y="364" font-weight="600">waiter</text><text x="60" y="382" fill="#44524c" font-size="12">marker · alive · deadline</text>
    <line x1="280" y1="368" x2="1120" y2="368" stroke="#e4e8e4" stroke-width="2"/>
    <circle cx="330" cy="368" r="7" fill="#0e7a4d"/>
    <rect x="360" y="290" width="420" height="96" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/>
    <text x="380" y="316" font-weight="700" fill="#0e7a4d">first poll, 1 minute in</text>
    <text x="380" y="338" font-size="12.5" font-family="ui-monospace, SF Mono, Menlo, monospace">ALL_DONE? no · kill -0 $pid? dead</text>
    <text x="380" y="362" font-size="12" fill="#44524c">stop, print the last 20 log lines</text>
    <text x="380" y="378" font-size="12" fill="#44524c">fix the path, relaunch</text>
    <text x="1120" y="404" text-anchor="end" fill="#7f8a84" font-size="12.5">the deadline is still there for the job that hangs</text>
  </g>
</svg>