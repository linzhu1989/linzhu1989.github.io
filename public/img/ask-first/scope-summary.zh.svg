<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="PingFang SC, Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="420" fill="#fbfbf9"/>
  <text x="300" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#a13333" font-weight="600">之前 · 带着空白说「开始」</text>
  <text x="900" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#0e7a4d" font-weight="600">之后 · 「开始」覆盖全部输入</text>
  <line x1="600" y1="40" x2="600" y2="380" stroke="#e4e8e4"/>
  <g font-size="13" fill="#182420">
    <rect x="90" y="70" width="420" height="250" rx="12" fill="#ffffff" stroke="#c9d0cb"/>
    <text x="114" y="100" font-weight="700">范围摘要</text>
    <g font-size="13" fill="#44524c">
      <text x="114" y="134">行数</text><text x="174" y="134">72 行里跑 2 行（48 行有配置）</text>
      <text x="114" y="160">跳过</text><text x="174" y="160">24 行，写明原因</text>
      <text x="114" y="186">邮箱</text><text x="174" y="186">你自己的邮箱</text>
      <text x="114" y="212">工具</text><text x="174" y="212">都在，VPN 已检查</text>
      <text x="114" y="238" fill="#a13333">语言</text><text x="174" y="238" fill="#a13333">（没显示，默认为空）</text>
    </g>
    <rect x="114" y="260" width="372" height="40" rx="8" fill="#f8e6e6" stroke="#a13333"/><text x="300" y="285" text-anchor="middle" fill="#a13333" font-size="12.5" font-weight="600">数字来源：计划脚本 + Agent 自己看的一眼</text>

    <rect x="690" y="70" width="420" height="250" rx="12" fill="#ffffff" stroke="#0e7a4d" stroke-width="2"/>
    <text x="714" y="100" font-weight="700">范围摘要</text>
    <g font-size="13" fill="#44524c">
      <text x="714" y="134">行数</text><text x="774" y="134">72 行里跑 2 行（48 行有配置）</text>
      <text x="714" y="160">跳过</text><text x="774" y="160">24 行，写明原因</text>
      <text x="714" y="186">邮箱</text><text x="774" y="186">你自己的邮箱</text>
      <text x="714" y="212">工具</text><text x="774" y="212">都在，VPN 已检查</text>
      <text x="714" y="238" fill="#0e7a4d" font-weight="700">语言</text><text x="774" y="238" fill="#0e7a4d" font-weight="700">es（来自以前成功的运行）</text>
    </g>
    <rect x="714" y="260" width="372" height="40" rx="8" fill="#e3f2ea" stroke="#0e7a4d"/><text x="900" y="285" text-anchor="middle" fill="#0e7a4d" font-size="12.5" font-weight="600">数字来源：只有计划脚本</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="200" y="336" width="200" height="36" rx="18" fill="#182420"/><text x="300" y="359" fill="#fff" font-weight="600">开始 = 带空白运行</text>
    <rect x="780" y="336" width="240" height="36" rx="18" fill="#0e7a4d"/><text x="900" y="359" fill="#fff" font-weight="600">开始 = 所有输入都在屏幕上</text>
  </g>
  <text x="600" y="404" text-anchor="middle" font-size="12.5" fill="#7f8a84">摘要多一行 · 不用再靠 Agent 半路发现问题</text>
</svg>
