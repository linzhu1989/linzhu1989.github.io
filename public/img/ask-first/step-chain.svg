<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7f8a84"/></marker></defs>
  <rect width="1200" height="440" fill="#fbfbf9"/>
  <text x="600" y="40" text-anchor="middle" font-size="13" letter-spacing="2" fill="#182420" font-weight="600">ONE BATCH RUN, STEP BY STEP</text>
  <g font-size="13" fill="#182420" text-anchor="middle">
    <rect x="50" y="86" width="190" height="62" rx="10" fill="#e3f2ea" stroke="#0e7a4d" stroke-width="2"/><text x="145" y="112" font-weight="700" fill="#0e7a4d">scope summary</text><text x="145" y="132" fill="#44524c" font-size="12">human says go</text>
    <rect x="280" y="86" width="190" height="62" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="375" y="122">preflight</text>
    <rect x="510" y="86" width="190" height="62" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="605" y="122">batch folders</text>
    <rect x="740" y="86" width="190" height="62" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="835" y="122">map the rows</text>
    <rect x="970" y="86" width="190" height="62" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="1065" y="122">pick email copy</text>
    <path d="M242 117 h36" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M472 117 h36" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M702 117 h36" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M932 117 h36" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M1065 150 v42 H145 v58" fill="none" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <rect x="470" y="172" width="260" height="40" rx="20" fill="#faf0da" stroke="#a06b12"/><text x="600" y="197" font-weight="600" fill="#a06b12">agent stopped here: "language?"</text>

    <rect x="50" y="252" width="190" height="62" rx="10" fill="#f8e6e6" stroke="#a13333" stroke-width="2"/><text x="145" y="278" font-weight="700" fill="#a13333">create reservation</text><text x="145" y="298" fill="#a13333" font-size="12">can't be undone</text>
    <rect x="280" y="252" width="190" height="62" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="375" y="288">seed signals</text>
    <rect x="510" y="252" width="190" height="62" rx="10" fill="#f8e6e6" stroke="#a13333" stroke-width="2"/><text x="605" y="278" font-weight="700" fill="#a13333">trigger the email</text><text x="605" y="298" fill="#a13333" font-size="12">can't be unsent</text>
    <rect x="740" y="252" width="190" height="62" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="835" y="288">wait</text>
    <rect x="970" y="252" width="190" height="62" rx="10" fill="#ffffff" stroke="#c9d0cb"/><text x="1065" y="278">check mailbox</text><text x="1065" y="298" fill="#44524c" font-size="12">write the summary</text>
    <path d="M242 283 h36" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M472 283 h36" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M702 283 h36" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>
    <path d="M932 283 h36" stroke="#7f8a84" stroke-width="1.6" marker-end="url(#a)"/>

    <rect x="50" y="346" width="420" height="50" rx="10" fill="#ffffff" stroke="#0e7a4d"/><text x="260" y="367" font-weight="600" fill="#0e7a4d">the question belongs on the scope summary</text><text x="260" y="386" fill="#44524c" font-size="12">before go, with nothing done yet</text>
  </g>
  <g font-size="12" fill="#44524c">
    <rect x="740" y="358" width="16" height="16" rx="3" fill="#ffffff" stroke="#c9d0cb"/><text x="764" y="371">can be rerun for free</text>
    <rect x="930" y="358" width="16" height="16" rx="3" fill="#f8e6e6" stroke="#a13333"/><text x="954" y="371">can't be taken back</text>
  </g>
  <text x="600" y="426" text-anchor="middle" font-size="12.5" fill="#7f8a84">it asked at the last safe moment · the right moment was the summary</text>
</svg>
