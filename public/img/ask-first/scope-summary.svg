<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" font-family="Avenir Next, Helvetica Neue, Segoe UI, sans-serif">
  <rect width="1200" height="420" fill="#fbfbf9"/>
  <text x="300" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#a13333" font-weight="600">BEFORE · GO WITH A BLANK</text>
  <text x="900" y="44" text-anchor="middle" font-size="13" letter-spacing="2" fill="#0e7a4d" font-weight="600">AFTER · GO MEANS EVERYTHING</text>
  <line x1="600" y1="40" x2="600" y2="380" stroke="#e4e8e4"/>
  <g font-size="13" fill="#182420">
    <rect x="90" y="70" width="420" height="250" rx="12" fill="#ffffff" stroke="#c9d0cb"/>
    <text x="114" y="100" font-weight="700">Scope summary</text>
    <g xml:space="preserve" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5" fill="#44524c">
      <text x="114" y="134">rows      2 of 72 (48 mapped)</text>
      <text x="114" y="160">skipped   24, with reasons</text>
      <text x="114" y="186">mailbox   your own address</text>
      <text x="114" y="212">tools     present, VPN checked</text>
      <text x="114" y="238" fill="#a13333">language  (not shown, defaults to "")</text>
    </g>
    <rect x="114" y="260" width="372" height="40" rx="8" fill="#f8e6e6" stroke="#a13333"/><text x="300" y="285" text-anchor="middle" fill="#a13333" font-size="12.5" font-weight="600">counts: plan script + the agent's own look</text>

    <rect x="690" y="70" width="420" height="250" rx="12" fill="#ffffff" stroke="#0e7a4d" stroke-width="2"/>
    <text x="714" y="100" font-weight="700">Scope summary</text>
    <g xml:space="preserve" font-family="ui-monospace, SF Mono, Menlo, monospace" font-size="12.5" fill="#44524c">
      <text x="714" y="134">rows      2 of 72 (48 mapped)</text>
      <text x="714" y="160">skipped   24, with reasons</text>
      <text x="714" y="186">mailbox   your own address</text>
      <text x="714" y="212">tools     present, VPN checked</text>
      <text x="714" y="238" fill="#0e7a4d" font-weight="700">language  es (from earlier passing runs)</text>
    </g>
    <rect x="714" y="260" width="372" height="40" rx="8" fill="#e3f2ea" stroke="#0e7a4d"/><text x="900" y="285" text-anchor="middle" fill="#0e7a4d" font-size="12.5" font-weight="600">counts: plan script only</text>
  </g>
  <g font-size="13" text-anchor="middle">
    <rect x="200" y="336" width="200" height="36" rx="18" fill="#182420"/><text x="300" y="359" fill="#fff" font-weight="600">go = run with a blank</text>
    <rect x="780" y="336" width="240" height="36" rx="18" fill="#0e7a4d"/><text x="900" y="359" fill="#fff" font-weight="600">go = every input, on screen</text>
  </g>
  <text x="600" y="404" text-anchor="middle" font-size="12.5" fill="#7f8a84">one more line on the summary · nothing left for the agent to catch mid-run</text>
</svg>
